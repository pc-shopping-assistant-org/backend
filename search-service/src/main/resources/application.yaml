spring:
  application:
    name: search-service
  datasource:
    url: jdbc:postgresql://localhost:5432/search_db
    username: postgres
    password: postgres
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: search-service

server:
  port: 8086

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
