spring:
  application:
    name: search-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/search_db
    username: postgres
    password: postgres
  flyway:
    enabled: true
    baseline-on-migrate: true
  elasticsearch:
    # The product index lives in an Elasticsearch node of docker-compose.yml.
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

server:
  port: 8086

security:
  jwt:
    jwks-uri: ${JWT_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
    issuer: ${JWT_SECURITY_ISSUER:http://identity-service}

management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 15s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  embedding:
    api-url: ${EMBEDDING_API_URL:}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:BAAI/bge-m3}
  search:
    cache-ttl: ${SEARCH_CACHE_TTL:5m}
    cache-window-size: ${SEARCH_CACHE_WINDOW_SIZE:500}
