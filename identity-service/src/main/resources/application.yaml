spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5432/identity_db
    username: postgres
    password: postgres
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8081

jwt:
  # RSA private/public keys are Base64-encoded PEM content without PEM markers.
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  key-id: ${JWT_KEY_ID:identity-key-1}
  issuer: ${JWT_ISSUER:http://identity-service}
  allow-dev-key-generation: ${JWT_ALLOW_DEV_KEY_GENERATION:true}
  access-token-expiration-ms: 86400000   # 24h
  refresh-token-expiration-ms: 604800000 # 7d

google:
  # Google OAuth 2.0 client ID for verifying ID tokens from Google Identity Services.
  # Configure via GOOGLE_CLIENT_ID environment variable.
  client-id: ${GOOGLE_CLIENT_ID:}

management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
