services:
  postgres:
    image: postgres:18.3-alpine
    container_name: pcshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: identity_db,catalog_db,order_db,payment_db,promotion_db,search_db,media_db,ai_db
    ports:
      - "5432:5432"
    volumes:
      - pcshop-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    container_name: pcshop-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI (http://localhost:15672)
    volumes:
      - pcshop-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pcshop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pcshop-redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # KRaft mode (no ZooKeeper), single-broker dev cluster. Services run on the HOST
  # via `mvn spring-boot:run` (not containerized), so the broker exposes a
  # host-reachable EXTERNAL listener alongside the internal PLAINTEXT one.
  kafka:
    image: apache/kafka:4.3.1
    container_name: pcshop-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: "fBTMcTq2Rx--FtWWppGltw"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Single-broker dev cluster: the defaults (RF=3) can never be satisfied,
      # which silently breaks consumer-group coordination because
      # __consumer_offsets never gets created.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    ports:
      - "29092:29092"
    volumes:
      - pcshop-kafka-data:/var/lib/kafka/data

  zipkin:
    image: openzipkin/zipkin:3.6.0
    container_name: pcshop-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411" # UI + query API (http://localhost:9411)

  # Services run on the HOST (not containerized), so the collector's OTLP
  # receiver is exposed on host-reachable ports; it then forwards spans to
  # zipkin over the internal compose network.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    container_name: pcshop-otel-collector
    restart: unless-stopped
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./docker/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    depends_on:
      - zipkin

  ai-service:
    profiles: [ai]
    build: ./ai-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AI_BACKEND_API_URL: ${AI_BACKEND_API_URL:-http://host.docker.internal:8082}
      AI_PROVIDER: ${AI_PROVIDER:-fallback}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AI_GEMINI_API_KEY: ${AI_GEMINI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pcshop-postgres-data:
  pcshop-rabbitmq-data:
  pcshop-redis-data:
  pcshop-kafka-data:
