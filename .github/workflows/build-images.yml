name: Build and publish backend service images

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: backend-images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify Java backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTGRES_PORT: '5433'
      JWT_ALLOW_DEV_KEY_GENERATION: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Start test dependencies
        run: docker compose up --detach --wait postgres redis rabbitmq kafka elasticsearch

      - name: Wait for Kafka
        run: |
          for attempt in $(seq 1 30); do
            if docker exec pcshop-kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              break
            fi
            sleep 2
          done
          echo 'Kafka did not become ready' >&2
          exit 1

      - name: Run backend tests and verify Maven reactor
        run: mvn -B -ntp verify

      - name: Upload executable service JARs
        uses: actions/upload-artifact@v4
        with:
          name: backend-service-jars
          path: |
            api-gateway/target/api-gateway-*.jar
            discovery-server/target/discovery-server-*.jar
            identity-service/target/identity-service-*.jar
            catalog-service/target/catalog-service-*.jar
            order-service/target/order-service-*.jar
            payment-service/target/payment-service-*.jar
            promotion-service/target/promotion-service-*.jar
            search-service/target/search-service-*.jar
            media-service/target/media-service-*.jar
            sync-service/target/sync-service-*.jar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  image:
    name: Build ${{ matrix.service }} image
    needs: verify
    if: >-
      github.ref == 'refs/heads/release' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - discovery-server
          - identity-service
          - catalog-service
          - order-service
          - payment-service
          - promotion-service
          - search-service
          - media-service
          - sync-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download verified JARs
        uses: actions/download-artifact@v4
        with:
          name: backend-service-jars
          path: .

      - name: Prepare image context
        run: |
          mkdir image-context
          cp '${{ matrix.service }}'/target/'${{ matrix.service }}'-*.jar image-context/app.jar
          cp docker/Dockerfile.service image-context/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/backend-${{ matrix.service }}
          tags: |
            type=raw,value=release
            type=sha,format=long,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./image-context
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: mode=max
          sbom: true

  deploy:
    name: Deploy backend release
    needs: image
    if: >-
      github.ref == 'refs/heads/release' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      RELEASE_COMPONENT: backend
      IMAGE_TAG: sha-${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Deploy verified image over SSH
        shell: bash
        run: |
          set -euo pipefail
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/release" --jq .sha)
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo 'Skip superseded release; branch head has changed'
            exit 0
          fi
          : "${SSH_HOST:?Set release variable SSH_HOST}"
          : "${SSH_USER:?Set release variable SSH_USER}"
          : "${DEPLOY_PATH:?Set release variable DEPLOY_PATH}"
          : "${SSH_PRIVATE_KEY:?Set release secret SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Set release secret SSH_KNOWN_HOSTS}"
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ && "$DEPLOY_PATH" != / ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          key_file="$RUNNER_TEMP/gearpc-deploy-key"
          hosts_file="$RUNNER_TEMP/gearpc-known-hosts"
          trap 'rm -f -- "$key_file" "$hosts_file"' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts_file"
          ssh -i "$key_file" -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o "UserKnownHostsFile=$hosts_file" \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$RELEASE_COMPONENT' '$IMAGE_TAG'" <<'REMOTE'
          set -euo pipefail
          cd -- "$1"
          bash scripts/deploy-release.sh "$2" "$3"
          REMOTE
